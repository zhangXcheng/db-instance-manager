<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据库实例管理系统 · 控制台</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e4e7ec;
    --text: #111827;
    --muted: #6b7280;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --success: #15803d;
    --success-bg: #ecfdf3;
    --danger: #b42318;
    --danger-bg: #fef3f2;
    --warn: #b54708;
    --warn-bg: #fffaeb;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .04);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  [hidden] { display: none !important; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 32px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .brand { display: flex; align-items: center; gap: 12px; }

  .logo {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: #fff;
    font-size: 18px;
  }

  .brand h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .2px; }
  .brand p { margin: 0; font-size: 12px; color: var(--muted); }

  .user-box { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }

  main { max-width: 1180px; margin: 0 auto; padding: 24px 32px 48px; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }

  .card .label { font-size: 12px; color: var(--muted); }
  .card .value { margin-top: 6px; font-size: 26px; font-weight: 650; letter-spacing: -.5px; }
  .card .sub { margin-top: 2px; font-size: 12px; color: var(--muted); }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--border);
  }

  .panel-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; }

  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 7px 13px;
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }

  .btn:hover { background: #f9fafb; border-color: #d0d5dd; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn.tiny { padding: 4px 9px; font-size: 12px; }
  .btn.danger { color: var(--danger); border-color: #fbd5d0; }
  .btn.danger:hover { background: var(--danger-bg); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .bars { padding: 18px; display: grid; gap: 14px; }

  .bar-row { display: grid; grid-template-columns: 110px 1fr 52px; align-items: center; gap: 12px; }
  .bar-label { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 8px; background: #f2f4f7; border-radius: 999px; overflow: hidden; }
  .bar-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #3b82f6, #6366f1);
    transition: width .4s ease;
  }
  .bar-value { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

  .table-wrap { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }

  th {
    text-align: left;
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
    padding: 10px 18px;
    background: #fafbfc;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td { padding: 12px 18px; border-bottom: 1px solid #f1f3f5; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }

  .mono {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
  }

  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.online { color: var(--success); background: var(--success-bg); }
  .badge.offline { color: var(--danger); background: var(--danger-bg); }
  .badge.unknown { color: var(--warn); background: var(--warn-bg); }

  .muted { color: var(--muted); }
  .empty { padding: 36px 18px; text-align: center; color: var(--muted); font-size: 13px; }

  .login-mask {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(15, 23, 42, .38);
    backdrop-filter: blur(3px);
    z-index: 20;
  }

  .login-card {
    width: 340px;
    background: var(--surface);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 20px 50px rgba(15, 23, 42, .22);
  }

  .login-card h2 { margin: 0 0 4px; font-size: 17px; }
  .login-card p { margin: 0 0 20px; font-size: 12.5px; color: var(--muted); }

  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }

  input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13.5px;
    margin-bottom: 14px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }

  .login-card .btn { width: 100%; padding: 9px; }

  .toast {
    position: fixed;
    right: 24px;
    bottom: 24px;
    max-width: 380px;
    padding: 12px 16px;
    border-radius: 9px;
    background: #111827;
    color: #fff;
    font-size: 13px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, .25);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    z-index: 30;
  }

  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--danger); }

  .foot { margin-top: 8px; text-align: center; font-size: 12px; color: var(--muted); }

  @media (max-width: 720px) {
    .topbar { padding: 14px 18px; }
    main { padding: 18px; }
    .bar-row { grid-template-columns: 82px 1fr 44px; }
    th, td { padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">◈</span>
    <div>
      <h1>数据库实例管理系统</h1>
      <p>Django · DRF · Celery &nbsp;|&nbsp; 演示控制台</p>
    </div>
  </div>
  <div class="user-box" id="userBox" hidden>
    <span id="userName"></span>
    <button class="btn tiny" id="logoutBtn" type="button">退出</button>
  </div>
</header>

<main id="main" hidden>
  <section class="cards" id="cards"></section>

  <section class="panel">
    <div class="panel-head">
      <h2>部门实例分布</h2>
      <span class="hint" id="statDate"></span>
    </div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>实例列表</h2>
      <div class="actions">
        <button class="btn" id="probeAllBtn" type="button">批量探测</button>
        <button class="btn" id="refreshBtn" type="button">刷新</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>实例</th>
            <th>地址</th>
            <th>集群 / 部门</th>
            <th>状态</th>
            <th>最近延迟</th>
            <th>凭据版本</th>
            <th style="text-align:right">操作</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <p class="foot">所有数据来自本项目的 REST API，页面本身不依赖任何前端框架。</p>
</main>

<div class="login-mask" id="loginMask">
  <form class="login-card" id="loginForm">
    <h2>登录控制台</h2>
    <p>使用 Django 超级管理员账号，Token 会保存在本地</p>
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit" id="loginBtn">登录</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var state = {
    token: localStorage.getItem("dm_token") || "",
    user: null,
    instances: [],
    stats: []
  };

  var el = {
    loginMask: document.getElementById("loginMask"),
    loginForm: document.getElementById("loginForm"),
    loginBtn: document.getElementById("loginBtn"),
    userBox: document.getElementById("userBox"),
    userName: document.getElementById("userName"),
    logoutBtn: document.getElementById("logoutBtn"),
    main: document.getElementById("main"),
    cards: document.getElementById("cards"),
    bars: document.getElementById("bars"),
    statDate: document.getElementById("statDate"),
    rows: document.getElementById("rows"),
    refreshBtn: document.getElementById("refreshBtn"),
    probeAllBtn: document.getElementById("probeAllBtn"),
    toast: document.getElementById("toast")
  };

  function esc(value) {
    return String(value === null || value === undefined ? "" : value).replace(
      /[&<>"']/g,
      function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      }
    );
  }

  var toastTimer = null;
  function toast(message, isError) {
    el.toast.textContent = message;
    el.toast.className = "toast show" + (isError ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.toast.className = "toast";
    }, 3200);
  }

  function api(path, options) {
    options = options || {};
    var headers = { "Content-Type": "application/json" };
    if (state.token) headers.Authorization = "Token " + state.token;
    if (options.headers) {
      Object.keys(options.headers).forEach(function (key) {
        headers[key] = options.headers[key];
      });
    }
    return fetch(path, {
      method: options.method || "GET",
      headers: headers,
      body: options.body
    }).then(function (response) {
      return response.text().then(function (text) {
        var data = null;
        if (text) {
          try { data = JSON.parse(text); } catch (err) { data = null; }
        }
        if (!response.ok) {
          if (response.status === 401) {
            logout();
          }
          var message = (data && (data.message || data.detail)) || "请求失败（HTTP " + response.status + "）";
          throw new Error(message);
        }
        return data;
      });
    });
  }

  function showLogin() {
    el.loginMask.hidden = false;
    el.main.hidden = true;
    el.userBox.hidden = true;
  }

  function showApp() {
    el.loginMask.hidden = true;
    el.main.hidden = false;
    el.userBox.hidden = false;
    el.userName.textContent = state.user ? state.user.username : "";
  }

  function logout() {
    state.token = "";
    state.user = null;
    localStorage.removeItem("dm_token");
    localStorage.removeItem("dm_user");
    showLogin();
  }

  function renderCards() {
    var total = state.instances.length;
    var online = state.instances.filter(function (item) { return item.status === "online"; }).length;
    var offline = state.instances.filter(function (item) { return item.status === "offline"; }).length;
    var clusters = {};
    state.instances.forEach(function (item) { clusters[item.cluster] = true; });

    var data = [
      { label: "实例总数", value: total, sub: "已登记在册" },
      { label: "在线", value: online, sub: "最近一次探测可达" },
      { label: "离线", value: offline, sub: "最近一次探测失败" },
      { label: "涉及集群", value: Object.keys(clusters).length, sub: "去重统计" }
    ];

    el.cards.innerHTML = data.map(function (item) {
      return '<div class="card"><div class="label">' + esc(item.label) + "</div>" +
        '<div class="value">' + esc(item.value) + "</div>" +
        '<div class="sub">' + esc(item.sub) + "</div></div>";
    }).join("");
  }

  function renderBars() {
    if (!state.stats.length) {
      el.statDate.textContent = "";
      el.bars.innerHTML = '<div class="empty">今日暂无统计快照，可执行 <code>python manage.py seed_demo</code> 或调用重建接口生成</div>';
      return;
    }
    var max = Math.max.apply(null, state.stats.map(function (item) { return item.total_count; }).concat([1]));
    el.statDate.textContent = "统计日期 " + state.stats_date;
    el.bars.innerHTML = state.stats.map(function (item) {
      var width = ((item.total_count / max) * 100).toFixed(1);
      return '<div class="bar-row">' +
        '<div class="bar-label" title="' + esc(item.department_name) + '">' + esc(item.department_name) + "</div>" +
        '<div class="bar-track"><div class="bar-fill" style="width:' + width + '%"></div></div>' +
        '<div class="bar-value">' + esc(item.total_count) + "</div>" +
        "</div>";
    }).join("");
  }

  function renderRows() {
    if (!state.instances.length) {
      el.rows.innerHTML = '<tr><td colspan="7"><div class="empty">还没有实例，先通过 API 或 admin 添加</div></td></tr>';
      return;
    }

    var labels = { online: "在线", offline: "离线", unknown: "未知" };

    el.rows.innerHTML = state.instances.map(function (item) {
      var status = item.status || "unknown";
      var latency = item.last_probe_latency_ms === null || item.last_probe_latency_ms === undefined
        ? '<span class="muted">—</span>'
        : esc(item.last_probe_latency_ms) + " ms";
      var version = item.current_credential
        ? "v" + esc(item.current_credential.version)
        : '<span class="muted">无凭据</span>';

      return "<tr>" +
        "<td><strong>" + esc(item.name) + "</strong></td>" +
        '<td class="mono">' + esc(item.endpoint) + "</td>" +
        "<td>" + esc(item.cluster_name) + '<br><span class="muted">' + esc(item.department_name) + "</span></td>" +
        '<td><span class="badge ' + esc(status) + '">' + esc(labels[status] || status) + "</span></td>" +
        "<td>" + latency + "</td>" +
        "<td>" + version + "</td>" +
        '<td style="text-align:right;white-space:nowrap">' +
          '<button class="btn tiny" data-act="probe" data-id="' + esc(item.id) + '">探测</button> ' +
          '<button class="btn tiny danger" data-act="rotate" data-id="' + esc(item.id) + '">轮换</button>' +
        "</td>" +
        "</tr>";
    }).join("");
  }

  function loadData() {
    return Promise.all([
      api("/api/instances/?page_size=100"),
      api("/api/stats/daily/by-department/")
    ]).then(function (results) {
      state.instances = (results[0] && results[0].results) || [];
      var stats = results[1] || {};
      state.stats = stats.results || [];
      state.stats_date = stats.stat_date || "";
      renderCards();
      renderBars();
      renderRows();
    });
  }

  function refresh() {
    return loadData().catch(function (error) {
      toast(error.message, true);
    });
  }

  function probe(id) {
    return api("/api/instances/" + id + "/probe/", { method: "POST" })
      .then(function (result) {
        var text = result.reachable
          ? "可达，" + result.latency_ms + " ms"
          : "不可达：" + (result.error || "未知原因");
        toast(result.endpoint + " " + text, !result.reachable);
        return loadData();
      })
      .catch(function (error) { toast(error.message, true); });
  }

  function rotate(id) {
    if (!window.confirm("确认立即轮换该实例密码？旧版本会保留在历史记录中。")) return;
    return api("/api/instances/" + id + "/rotate-password/", { method: "POST" })
      .then(function (result) {
        var item = (result.results || [])[0] || {};
        if (item.status === "rotated") {
          toast("轮换成功，凭据已升级到 v" + item.version);
        } else {
          toast("未轮换：" + (item.error || item.status), true);
        }
        return loadData();
      })
      .catch(function (error) { toast(error.message, true); });
  }

  el.loginForm.addEventListener("submit", function (event) {
    event.preventDefault();
    el.loginBtn.disabled = true;
    el.loginBtn.textContent = "登录中…";

    var payload = JSON.stringify({
      username: document.getElementById("username").value.trim(),
      password: document.getElementById("password").value
    });

    api("/api/auth/login/", { method: "POST", body: payload })
      .then(function (data) {
        state.token = data.token;
        state.user = data.user;
        localStorage.setItem("dm_token", data.token);
        localStorage.setItem("dm_user", JSON.stringify(data.user));
        showApp();
        return refresh();
      })
      .catch(function (error) {
        toast(error.message || "登录失败", true);
      })
      .finally(function () {
        el.loginBtn.disabled = false;
        el.loginBtn.textContent = "登录";
      });
  });

  el.logoutBtn.addEventListener("click", logout);
  el.refreshBtn.addEventListener("click", function () { refresh().then(function () { toast("已刷新"); }); });
  el.probeAllBtn.addEventListener("click", function () {
    api("/api/instances/probe-batch/", { method: "POST", body: "{}" })
      .then(function (result) {
        toast("批量探测完成，共 " + result.count + " 个实例");
        return loadData();
      })
      .catch(function (error) { toast(error.message, true); });
  });

  el.rows.addEventListener("click", function (event) {
    var button = event.target.closest("button[data-act]");
    if (!button) return;
    var id = button.getAttribute("data-id");
    button.disabled = true;
    var action = button.getAttribute("data-act") === "probe" ? probe(id) : rotate(id);
    Promise.resolve(action).finally(function () { button.disabled = false; });
  });

  // 带着旧 Token 进来时先验证一次，失效就回登录页
  if (state.token) {
    try {
      state.user = JSON.parse(localStorage.getItem("dm_user") || "null");
    } catch (err) {
      state.user = null;
    }
    api("/api/instances/?page_size=1")
      .then(function () {
        showApp();
        el.userName.textContent = state.user ? state.user.username : "已登录";
        return refresh();
      })
      .catch(function () {
        logout();
      });
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
